[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "infinitime-builder"
dynamic = ["version"]
description = "Pick, order and add third-party apps and watch faces, then build your own InfiniTime firmware"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "InfiniTime Builder", email = "scanuproductions@gmail.com" }]
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
infinitime-builder-cli = "itbuilder.cli:main"

[project.gui-scripts]
infinitime-builder = "itbuilder.gui:main"

[project.urls]
Homepage = "https://github.com/ScanuNicco/infinitime-builder"
Issues = "https://github.com/ScanuNicco/infinitime-builder/issues"

[tool.setuptools]
packages = ["itbuilder"]

[tool.setuptools.dynamic]
version = { attr = "itbuilder.__version__" }

[tool.setuptools.package-data]
itbuilder = ["screenshots/*.png", "icon.svg"]
